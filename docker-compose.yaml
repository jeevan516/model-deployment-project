# The prediction API in Docker (macOS and Windows):
#   docker compose up -d --build
#   curl http://127.0.0.1:8004/health
# It serves artifacts/model.skops. If there is none yet, the container downloads January 2025
# and trains the HistGradientBoosting model on first start (about a minute; watch with
# docker compose logs -f api). Your own trained model: uv run python -m src.compare --models hgb --save hgb
# Host port 8004 by default (8000 is often used by other projects); change with API_HOST_PORT.
name: model-deployment-project

services:
  api:
    build: .
    image: model-deployment-project-api:latest
    ports:
      - "${API_HOST_PORT:-8004}:8000"
    volumes:
      - ./artifacts:/app/artifacts         # model.skops + model.json (trained here if missing)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 5
    restart: unless-stopped
