name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Tests
        run: uv run python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t model-deployment-project-api:ci .
      - name: First start trains a model and serves it
        run: |
          docker run -d --name api -p 8000:8000 model-deployment-project-api:ci
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 5; done
          curl -sf -X POST localhost:8000/predict -H "Content-Type: application/json" -d @sample-request.json
          docker logs api | tail -5
